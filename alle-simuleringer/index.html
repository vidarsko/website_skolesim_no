<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alle simuleringer — Skolesim.no</title>
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script id="i18n-dict" type="application/json">
  {
    "nav-alle-sim": {"no": "Alle simuleringer", "en": "All simulations"},
    "nav-fagoversikt": {"no": "Fagoversikt", "en": "Subjects"},
    "nav-om-meg": {"no": "Om meg", "en": "About"},
    "alle-sim-heading": {"no": "Alle simuleringer", "en": "All simulations"},
    "alle-sim-lead": {"no": "Velg fag og/eller tema for å filtrere.", "en": "Pick a subject and/or a topic to filter."},
    "filter-fag-label": {"no": "Fag", "en": "Subject"},
    "filter-tema-label": {"no": "Tema", "en": "Topic"},
    "filter-all-fag": {"no": "Alle fag", "en": "All subjects"},
    "filter-all-tema": {"no": "Alle tema", "en": "All topics"},
    "filter-tema-hint": {"no": "Velg et fag for å se tema.", "en": "Choose a subject to see its topics."},
    "load-more-btn": {"no": "Vis flere", "en": "Show more"},
    "empty-state": {"no": "Ingen simuleringer i denne kategorien ennå.", "en": "No simulations in this category yet."},
    "footer-copyright": {"no": "Copyright 2026 – Skolesim", "en": "Copyright 2026 – Skolesim"},
    "footer-privacy": {"no": "Personvernerklæring", "en": "Privacy policy"},
    "theme-toggle-aria": {"no": "Bytt fargetema", "en": "Toggle color theme"}
  }
  </script>
</head>
<body>

  <header class="site-header">
    <div class="wide">
      <p class="site-title"><a href="/">Skolesim</a></p>
      <div class="header-right">
        <nav>
          <ul class="site-nav">
            <li><a href="/alle-simuleringer/" data-i18n="nav-alle-sim">Alle simuleringer</a></li>
            <li><a href="/#fagoversikt" data-i18n="nav-fagoversikt">Fagoversikt</a></li>
            <li><a href="#" data-i18n="nav-om-meg">Om meg</a></li>
          </ul>
        </nav>
        <div class="nav-controls">
          <button class="theme-toggle" type="button" data-i18n-attr="aria-label:theme-toggle-aria" aria-label="Bytt fargetema" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
          </button>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="no">NO</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="section-lead">
      <h2 data-i18n="alle-sim-heading">Alle simuleringer</h2>
      <p data-i18n="alle-sim-lead">Klikk på en kategori for å filtrere.</p>
    </div>
    <div class="wide">
      <div class="filter-groups">
        <div>
          <p class="filter-group-label" data-i18n="filter-fag-label">Fag</p>
          <div class="filter-box"><div class="filter-bar filter-bar--fag" data-simulations-filters-fag></div></div>
        </div>
        <div>
          <p class="filter-group-label" data-i18n="filter-tema-label">Tema</p>
          <div class="filter-box"><div class="filter-bar filter-bar--tema" data-simulations-filters-tema></div></div>
        </div>
      </div>
      <div class="posts-grid" data-simulations-grid></div>
      <div class="load-more" data-load-more></div>
    </div>
  </section>

  <script src="/js/theme.js" defer></script>
  <script src="/js/i18n.js" defer></script>
  <script src="/js/simulations.js" defer></script>

  <footer class="site-footer">
    <div class="wide">
      <p data-i18n="footer-copyright">Copyright 2026 – Skolesim</p>
      <nav><a href="#" data-i18n="footer-privacy">Personvernerklæring</a></nav>
    </div>
  </footer>

</body>
</html>
